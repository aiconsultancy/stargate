minimum_prek_version = "0.5.10"
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]
fail_fast = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-symlinks" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "gitleaks"
name = "Detect secrets in the Git index"
# Scan all indexed files, not history or untracked local credentials.
# A full index snapshot also covers CI, where the staged diff is empty.
entry = """
set -eu
snapshot=$(mktemp -d)
trap 'rm -rf "$snapshot"' EXIT HUP INT TERM
git checkout-index --all --prefix="$snapshot/"
mise exec -- gitleaks dir --redact --no-banner "$snapshot"
"""
shell = "sh"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "workflow-lint"
name = "GitHub Actions validation"
entry = "mise run workflow-check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "stargate-check"
name = "Strict TypeScript, Biome, and tests"
# Fixtures create other repositories; do not inherit this commit's Git state.
entry = """
unset $(git rev-parse --local-env-vars)
exec mise run check
"""
shell = "sh"
language = "system"
pass_filenames = false
always_run = true
