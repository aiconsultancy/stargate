minimum_prek_version = "0.5.10"
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "pre-push"]
fail_fast = true

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-symlinks" },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "gitleaks"
name = "Detect secrets in the Git index"
# Scan all indexed files, not history or untracked local credentials.
# A full index snapshot also covers CI, where the staged diff is empty.
entry = """
set -eu
snapshot=$(mktemp -d)
trap 'rm -rf "$snapshot"' EXIT HUP INT TERM
git checkout-index --all --prefix="$snapshot/"
mise exec -- gitleaks dir --redact --no-banner "$snapshot"
"""
shell = "sh"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "workflow-lint"
name = "GitHub Actions validation"
entry = "mise run workflow-check"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "stargate-check"
name = "Strict TypeScript, Oxlint, and affected tests"
# Resolve staged dependencies before clearing Git's local environment for tests.
# Untrusted paths defer to hosted Quality checks by default; select known tests.
# STARGATE_UNTRUSTED_TESTS=full opts in to a local full run for untrusted paths.
# Selection errors always run all tests. CI also runs check explicitly.
entry = "mise run check-affected"
language = "system"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "main-ancestor"
name = "Require rebase before pushing behind-main branches"
# The hook fetches origin/main itself and refuses unverified pushes; it
# never rewrites history. Re-run `make hooks-install` after pulling this
# change to install the pre-push hook type in your clone.
entry = "scripts/hooks/pre-push-main.sh"
language = "system"
stages = ["pre-push"]
pass_filenames = false
always_run = true
