[tools]
bun = "1.4.4"
prek = "0.5.10"
gitleaks = "8.30.1"
jactionlint = "2.5.0"
shellcheck = "0.11.0"
"github:withakay/mesij" = "0.1.0"

[tasks.deps]
description = "Install dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.stargate]
description = "Run any Stargate CLI command"
run = "bun run src/main.ts"
raw = true

[tasks.init]
description = "Run the interactive Slack setup wizard"
run = "bun run src/main.ts init"
raw = true

[tasks.crew-init]
description = "Install the default OpenCode captain/crew profile"
run = "bun run src/main.ts crew init"
raw = true

[tasks.provision]
description = "Plan or resume batch Slack app provisioning"
run = "bun run src/main.ts bot provision"
raw = true

[tasks.cua-install]
description = "Install the optional pinned agent-browser Chromium driver"
run = "mise exec node@24.21.0 npm:agent-browser@0.41.2 -- agent-browser install"

[tasks.cua]
description = "Run the optional portable browser driver"
run = "mise exec node@24.21.0 npm:agent-browser@0.41.2 -- agent-browser"
raw = true

[tasks.start]
description = "Run configured Slack bots"
run = "bun run src/main.ts start"
raw = true

[tasks.config-check]
description = "Validate Stargate configuration and token references"
run = "bun run src/main.ts config check"
raw = true

[tasks.manifest]
description = "Generate a Slack app manifest"
run = "bun run src/main.ts manifest"
raw = true

[tasks.service]
description = "Manage the systemd user service (install/start/stop/status/uninstall)"
run = "bun run src/main.ts service"
raw = true

[tasks.check]
description = "Run typecheck, lint, and tests"
run = "bun run check"

[tasks.check-affected]
description = "Run typecheck, lint, and tests affected by the Git index"
run = "bun run typecheck && bun run lint && bun scripts/hooks/affected-tests.ts"

[tasks.test]
description = "Run tests"
run = "bun test"

[tasks.architecture-refresh]
description = "Preview architecture inventory reductions; add --write to save"
run = "bun scripts/refresh-architecture-baseline.ts --root ."

[tasks.strobe]
description = "Run the project-pinned Strobe CLI"
run = "bun x --no-install strobe"
raw = true

[tasks.perf-check]
description = "Check the CLI performance benchmark without a timing verdict"
run = "bun x --no-install strobe bench perf/smoke.bench.ts --head . --check --power keep --reserve-cpus off --max-time 2m"

[tasks.perf-compare]
description = "Compare CLI startup against origin/main on a quiet machine"
run = "bun x --no-install strobe bench perf/smoke.bench.ts --base origin/main --head . --power keep --reserve-cpus off --require-verdict"

[tasks.test-release-env]
description = "Run tests as a self-update does: minimal environment, hidden TMPDIR"
run = "bun run scripts/test-release-env.ts"

[tasks.eval]
description = "Evaluate conversation liveness, isolation, routing, and no-replay behavior"
run = "bun test tests/conversation-eval.test.ts tests/crew.test.ts tests/captain-gateway.test.ts tests/backends.test.ts tests/gateway-attachments.test.ts tests/opencode-attachments.test.ts -t '(conversation|attachment) eval:'"

[tasks.typecheck]
description = "Check TypeScript types"
run = "bun run typecheck"

[tasks.lint]
description = "Check lint and formatting"
run = "bun run lint"

[tasks.oxlint]
description = "Run the vendored anti-slop Oxlint rules over src and tests"
run = "bun run oxlint"

[tasks.format]
description = "Apply lint and formatting fixes"
run = "bun run format"

[tasks.hooks-install]
description = "Install repository pre-commit hooks"
run = "prek install"

[tasks.hooks]
description = "Run all pre-commit checks against tracked files"
run = "prek run --all-files"

[tasks.workflow-check]
description = "Validate GitHub Actions workflows"
run = "jactionlint --strict-exit --shellcheck=shellcheck --no-online"
