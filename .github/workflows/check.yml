name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Preserve main's exact-commit evidence for a later approved release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    # Leave headroom for full-suite and runner variance.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the architecture baseline and provenance checks.
          fetch-depth: 0
      - name: Verify dependency commit provenance
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.commits')
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" |
            jq -e --argjson count "$count" --arg head "$HEAD_SHA" '
              add | length == $count and $count > 0 and .[-1].sha == $head and
              all(.[]; .author.login == "dependabot[bot]" and .commit.verification.verified == true)
            '
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install locked dependencies
        run: mise run deps
      - name: Verify Markdown preview layout in Chromium
        run: |
          browser=$(command -v google-chrome)
          STARGATE_TEST_CHROMIUM="$browser" mise exec -- bun test tests/markdown-preview.test.ts
      - name: Prepare private per-run test directories
        shell: bash
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/stargate-tests.XXXXXX")
          install -d -m 700 "$test_tmp/opencode" "$test_tmp/cache"
          printf 'TMPDIR=%s\nXDG_CACHE_HOME=%s/cache\n' "$test_tmp" "$test_tmp" >> "$GITHUB_ENV"
      # This runs strict typecheck and lint. A clean index selects no tests.
      - name: Run pre-commit checks
        run: mise run hooks
      # Compares the checked-out tree with its first parent: for a PR the
      # merge ref against the target tip, for a push the commit against
      # github.event.before. See docs/development.md.
      - name: Compare architecture baseline with its Git parent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) set -- --pr-head "$PR_HEAD_SHA" ;;
            push) set -- --push-before "$PUSH_BEFORE_SHA" ;;
            *)
              echo "::error::architecture comparison: unsupported event $EVENT_NAME"
              exit 1
              ;;
          esac
          mise exec -- bun scripts/check-architecture-baseline.ts --root "$PWD" "$@"
      - name: Run Mesij integration tests with pinned tools
        run: mise exec -- bun test tests/mesij.test.ts
      - name: Run test suite in the self-update environment
        run: mise run test-release-env

  flag-red-main:
    name: Flag red main
    needs: quality
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.quality.result == 'failure' || needs.quality.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Flag broken main or close recovery issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current_main" != "$HEAD_SHA" ]; then
            echo "Skipping red-main update: $HEAD_SHA is no longer current main ($current_main)."
            exit 0
          fi

          short_sha="${HEAD_SHA:0:8}"
          run_url="https://github.com/$GH_REPO/actions/runs/$RUN_ID"
          commit_url="https://github.com/$GH_REPO/commit/$HEAD_SHA"
          open_issues=$(gh api --paginate "repos/$GH_REPO/issues?state=open&labels=red-main&per_page=100" \
            --jq '.[] | select(.pull_request == null) | .number')

          if [ "$QUALITY_RESULT" = "success" ]; then
            while IFS= read -r num; do
              [ -n "$num" ] || continue
              gh issue close "$num" --repo "$GH_REPO" --comment "main is green again on [\`$short_sha\`]($commit_url) ([Quality checks]($run_url))."
            done <<< "$open_issues"
            exit 0
          fi

          gh label create red-main --repo "$GH_REPO" --color b60205 \
            --description "main broke Quality checks; fix in a follow-up PR before releasing" \
            --force >/dev/null 2>&1 || true

          commit_json=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA")
          author_login=$(printf '%s' "$commit_json" | jq -r '.author.login // empty')
          if [ -n "$author_login" ]; then
            author="@$author_login"
          else
            author="unlinked git author"
          fi

          pulls_json=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" 2>/dev/null || printf '[]')
          pr_line=$(printf '%s' "$pulls_json" | jq -r '.[0] // empty | "#\(.number) by @\(.user.login)"')

          body=$(cat <<EOF
          \`main\` went red on commit [\`$short_sha\`]($commit_url). No release can be cut until \`Quality checks\` is green on \`main\`. Open a follow-up PR to fix it.

          | Field | Value |
          | --- | --- |
          | Commit | [\`$HEAD_SHA\`]($commit_url) |
          | PR | ${pr_line:-none} |
          | Author | $author |
          | Pushed by | @$PUSH_ACTOR |
          | Failing run | [Quality checks]($run_url) |
          EOF
          )

          first_open=$(printf '%s\n' "$open_issues" | head -n 1)
          if [ -n "$first_open" ]; then
            gh issue comment "$first_open" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --label red-main \
              --title "Red main: $short_sha broke Quality checks" \
              --body "$body"
          fi
