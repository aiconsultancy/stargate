name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # Preserve main's exact-commit evidence for a later approved release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    # The full suite takes 8–10 minutes on main; leave headroom for runner variance.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the architecture baseline and provenance checks.
          fetch-depth: 0
      - name: Verify dependency commit provenance
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.commits')
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits?per_page=100" |
            jq -e --argjson count "$count" --arg head "$HEAD_SHA" '
              add | length == $count and $count > 0 and .[-1].sha == $head and
              all(.[]; .author.login == "dependabot[bot]" and .commit.verification.verified == true)
            '
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install locked dependencies
        run: mise run deps
      - name: Prepare private per-run test directories
        shell: bash
        run: |
          test_tmp=$(mktemp -d "$RUNNER_TEMP/stargate-tests.XXXXXX")
          install -d -m 700 "$test_tmp/opencode" "$test_tmp/cache"
          printf 'TMPDIR=%s\nXDG_CACHE_HOME=%s/cache\n' "$test_tmp" "$test_tmp" >> "$GITHUB_ENV"
      - name: Run pre-commit checks
        run: mise run hooks
      # Compares the checked-out tree with its first parent: for a PR the
      # merge ref against the target tip, for a push the commit against
      # github.event.before. See docs/development.md.
      - name: Compare architecture baseline with its Git parent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) set -- --pr-head "$PR_HEAD_SHA" ;;
            push) set -- --push-before "$PUSH_BEFORE_SHA" ;;
            *)
              echo "::error::architecture comparison: unsupported event $EVENT_NAME"
              exit 1
              ;;
          esac
          mise exec -- bun scripts/check-architecture-baseline.ts --root "$PWD" "$@"
      # --all-files has no staged diff. Do not rely on affected-test selection
      # for the hosted Quality gate: run typecheck, lint and the entire suite.
      - name: Run full quality checks
        run: mise run check
      # Self-updates test a release with a minimal environment and a hidden
      # TMPDIR; a test that only passes with the developer's environment
      # would block every update.
      - name: Run tests in the self-update environment
        run: mise run test-release-env
