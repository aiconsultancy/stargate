name: Release

# Manual only. Preview is read-only; publication needs release-environment approval.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview version and notes without publishing (false requires release approval)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Preview release candidate
    if: >-
      github.repository_id == '1459142785' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          cache: false
      - name: Require current main and passed Quality checks
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "Candidate is no longer main"; exit 1; }
          passed=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=Quality%20checks&app_id=15368" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "Quality checks have not passed for $HEAD_SHA"; exit 1; }
      - name: Compute version and flag decisions
        id: version
        env:
          FORCE_RELEASE: "true"
        run: bun scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Summarise candidate for approval
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '## Release candidate %s\n\nCommit SHA: %s\n\n' "$VERSION" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -f release-notes.md ]; then cat release-notes.md >> "$GITHUB_STEP_SUMMARY"; fi

  release:
    name: Tag and publish release
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.version != '' }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          # A restored cache could reach the published archive.
          cache: false
      - name: Require current main after approval
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "Candidate is no longer main; dispatch and approve a new run"; exit 1; }
      - name: Require passed Quality checks
        run: |
          passed=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=Quality%20checks&app_id=15368" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "Quality checks have not passed for $HEAD_SHA"; exit 1; }
      - name: Compute version
        id: version
        env:
          FORCE_RELEASE: "true"
          APPROVED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun scripts/release-version.ts > candidate-version.txt
          grep -Fx "version=$APPROVED_VERSION" candidate-version.txt
          cat candidate-version.txt >> "$GITHUB_OUTPUT"
      - name: Build source archive and checksum
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="stargate-v$VERSION/" -o "dist/stargate-v$VERSION.tar.gz" "$HEAD_SHA"
          (cd dist && sha256sum "stargate-v$VERSION.tar.gz" > "stargate-v$VERSION.tar.gz.sha256")
      - name: Create tag and release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "v$VERSION"
          --target "$HEAD_SHA"
          --title "v$VERSION"
          --notes-file release-notes.md
          "dist/stargate-v$VERSION.tar.gz"
          "dist/stargate-v$VERSION.tar.gz.sha256"
