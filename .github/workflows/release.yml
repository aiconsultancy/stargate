name: Release

# Called by Checks after the quality job on a push to main. Releases only when
# a commit since the last tag needs one (scripts/release-version.ts). A manual
# run on main releases the current head (at least a patch) once its Quality
# checks have passed.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    if: >-
      github.repository == 'aiconsultancy/stargate' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # A restored cache could reach the published archive.
          cache: false
      - name: Skip a commit that is no longer the head of main
        id: head
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          echo "current=$([ "$current" = "$HEAD_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Require passed Quality checks for a manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          passed=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?check_name=Quality%20checks&app_id=15368" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "Quality checks have not passed for $HEAD_SHA"; exit 1; }
      - name: Compute version
        id: version
        if: steps.head.outputs.current == 'true'
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun scripts/release-version.ts >> "$GITHUB_OUTPUT"
      - name: Build source archive and checksum
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="pogo-v$VERSION/" -o "dist/pogo-v$VERSION.tar.gz" "$HEAD_SHA"
          (cd dist && sha256sum "pogo-v$VERSION.tar.gz" > "pogo-v$VERSION.tar.gz.sha256")
      - name: Create tag and release
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "v$VERSION"
          --target "$HEAD_SHA"
          --title "v$VERSION"
          --notes-file release-notes.md
          "dist/pogo-v$VERSION.tar.gz"
          "dist/pogo-v$VERSION.tar.gz.sha256"
