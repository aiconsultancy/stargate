version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
      # Operator-approved immediate updates (November 2026): the Rust
      # TypeScript checker, the Bun runtime package, and Effect. The Effect
      # version-alignment group policy above is unchanged.
      exclude:
        - tsrs
        - "@tsrs/*"
        - bun
        - effect
        - "@effect/*"
    commit-message:
      prefix: chore
      include: scope
    groups:
      pi-runtime:
        patterns: ["@earendil-works/*"]
      opencode-sdk:
        # Keep Effect compatible with the OpenCode SDK (AGENTS.md).
        patterns: ["@opencode/*", "effect"]
      dependencies:
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
